# open_id 在不同飞书自建应用中通常不同；请替换为纪要应用收到的真实值。
# template_key 必须与 Word 模板中的 Jinja 占位符一致且不能重复。
# 修改本文件后，管理员私聊机器人发送“重载人员配置”即可免重启生效；
# 离职将 enabled 改为 false，新人顶替旧岗位直接改绑该条目的 open_id 和 name。
people:
  ou_bbb41d7292315838843fd1c515845e58:
    name: 朱飞
    department: 示例部门
    template_key: employee_1
    section_order: 1
    sort_order: 1
    enabled: true
    role: employee

  ou_replace_employee_2:
    name: 示例员工乙
    department: 示例部门
    template_key: employee_2
    section_order: 1
    sort_order: 2
    enabled: true
    role: admin

# 只有此列表中的 open_id 可以执行“生成本周纪要”和“查看本周提交状态”。
admins:
  - ou_replace_employee_2
